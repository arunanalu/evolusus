name: Deploy demonstration dashboard

on:
  push:
    branches: [main]
    paths:
      - 'docs/visualizacao/**'
      - 'data/gold_table/export.csv'
      - '.github/workflows/deploy-demonstracao.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build published demonstration
        run: |
          mkdir -p _site
          cp docs/visualizacao/index.html _site/index.html
          cp data/gold_table/export.csv _site/export.csv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
