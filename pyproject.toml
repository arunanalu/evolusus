[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolusus-acquisition"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
# AGPL-3.0: instalar somente após aceite explícito da licença pelo projeto.
dbc = ["pyreaddbc==2.0.4", "pandas>=2.2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
